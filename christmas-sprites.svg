<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="600" viewBox="0 0 600 600">
  <!-- Christmas background tile: hand-drawn sprites, repeated behind each section
       while the Christmas theme is on (see the "Christmas" block in style.css).
       Outline colour matches the brand text colour (#2B4544). -->
  <defs>
    <!-- Body outlines are drawn as a fat dark copy of the shape under a filled copy,
         so overlapping parts (head, arms, legs) merge into one outlined silhouette. -->
    <g id="gbm-shape">
      <circle cx="32" cy="14" r="10"/>
      <rect x="10" y="24" width="44" height="10" rx="5"/>
      <rect x="21" y="22" width="22" height="24" rx="7"/>
      <rect x="18" y="38" width="11" height="21" rx="5.5" transform="rotate(12 23 40)"/>
      <rect x="35" y="38" width="11" height="21" rx="5.5" transform="rotate(-12 41 40)"/>
    </g>
    <g id="gbd-shape">
      <rect x="10" y="26" width="38" height="18" rx="9"/>
      <rect x="13" y="36" width="9" height="20" rx="4.5"/>
      <rect x="36" y="36" width="9" height="20" rx="4.5"/>
      <circle cx="47" cy="22" r="11"/>
      <rect x="50" y="22" width="12" height="10" rx="5"/>
      <rect x="9" y="14" width="7" height="18" rx="3.5" transform="rotate(-35 13 30)"/>
    </g>
    <g id="snow-shape">
      <circle cx="32" cy="46" r="14"/>
      <circle cx="32" cy="24" r="10"/>
    </g>
    <g id="snowdog-shape">
      <circle cx="32" cy="46" r="14"/>
      <circle cx="32" cy="25" r="10"/>
      <ellipse cx="22" cy="26" rx="4" ry="8" transform="rotate(20 22 26)"/>
      <ellipse cx="42" cy="26" rx="4" ry="8" transform="rotate(-20 42 26)"/>
    </g>
    <g id="deer-shape">
      <ellipse cx="32" cy="35" rx="12" ry="15"/>
      <ellipse cx="18" cy="25" rx="7" ry="3.5" transform="rotate(-25 18 25)"/>
      <ellipse cx="46" cy="25" rx="7" ry="3.5" transform="rotate(25 46 25)"/>
    </g>
    <path id="antlers" d="M26 22Q21 13 15 5M20 13L11 12M17 8L19 2M38 22Q43 13 49 5M44 13L53 12M47 8L45 2"/>
    <path id="cane-path" d="M26 60V22a10 10 0 0 1 20 0v5"/>
    <path id="flake-arm" d="M32 32V7M32 15l-6-6M32 15l6-6M32 23l-5-4M32 23l5-4"/>
    <path id="leaf" d="M32 34Q30 26 22 24Q21 19 15 19Q15 14 9 12Q17 9 22 14Q27 12 28 18Q34 20 32 34Z"/>

    <symbol id="cane" viewBox="0 0 64 64">
      <use href="#cane-path" xlink:href="#cane-path" fill="none" stroke="#2B4544" stroke-width="12" stroke-linecap="round"/>
      <use href="#cane-path" xlink:href="#cane-path" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <use href="#cane-path" xlink:href="#cane-path" fill="none" stroke="#C0392B" stroke-width="8" stroke-dasharray="5 5"/>
    </symbol>

    <symbol id="tree" viewBox="0 0 64 64">
      <g stroke="#2B4544" stroke-width="2.5" stroke-linejoin="round">
        <rect x="28" y="44" width="8" height="16" fill="#7A4A2A"/>
        <path d="M32 6L50 30H42L54 46H10L22 30H14Z" fill="#3E7B4F"/>
        <circle cx="25" cy="39" r="3" fill="#C0392B"/>
        <circle cx="39" cy="27" r="3" fill="#E2A93B"/>
        <circle cx="40" cy="41" r="3" fill="#C0392B"/>
        <circle cx="29" cy="24" r="2.5" fill="#fff"/>
      </g>
      <path d="M32 0l2.4 5 5.4.6-4 3.7 1.1 5.3L32 12l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z" fill="#E2A93B" stroke="#2B4544" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>

    <symbol id="gingerbread" viewBox="0 0 64 64">
      <use href="#gbm-shape" xlink:href="#gbm-shape" fill="#2B4544" stroke="#2B4544" stroke-width="5"/>
      <use href="#gbm-shape" xlink:href="#gbm-shape" fill="#C9824A"/>
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <path d="M28 17q4 3 8 0"/>
        <path d="M15 25.5q1.5 1.75 0 3.5q-1.5 1.75 0 3.5M49 25.5q1.5 1.75 0 3.5q-1.5 1.75 0 3.5"/>
        <path d="M20 54q2.5 1.5 5 0M39 54q2.5 1.5 5 0"/>
      </g>
      <circle cx="28.5" cy="12" r="1.6" fill="#2B4544"/>
      <circle cx="35.5" cy="12" r="1.6" fill="#2B4544"/>
      <circle cx="32" cy="30" r="2.2" fill="#C0392B"/>
      <circle cx="32" cy="38" r="2.2" fill="#3E7B4F"/>
    </symbol>

    <symbol id="ginger-dog" viewBox="-4 -2 70 66">
      <use href="#gbd-shape" xlink:href="#gbd-shape" fill="#2B4544" stroke="#2B4544" stroke-width="5"/>
      <use href="#gbd-shape" xlink:href="#gbd-shape" fill="#C9824A"/>
      <ellipse cx="43" cy="23" rx="4.5" ry="9" transform="rotate(15 43 23)" fill="#A8652F" stroke="#2B4544" stroke-width="2"/>
      <circle cx="51" cy="19" r="1.8" fill="#2B4544"/>
      <circle cx="61" cy="24" r="2.4" fill="#2B4544"/>
      <path d="M38 27q3 6 1 13" fill="none" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <path d="M15 33q2.5 3 5 0t5 0t5 0"/>
        <path d="M14.5 52h6M37.5 52h6"/>
      </g>
    </symbol>

    <symbol id="snowman" viewBox="0 0 64 64">
      <path d="M19 42L7 34M11 37l-3-6M45 42l12-8M53 37l3-6" fill="none" stroke="#7A4A2A" stroke-width="2.5" stroke-linecap="round"/>
      <use href="#snow-shape" xlink:href="#snow-shape" fill="#2B4544" stroke="#2B4544" stroke-width="5"/>
      <use href="#snow-shape" xlink:href="#snow-shape" fill="#fff"/>
      <g stroke="#2B4544" stroke-width="1.5" stroke-linejoin="round">
        <rect x="25" y="1" width="14" height="13" fill="#2B4544"/>
        <rect x="25" y="9" width="14" height="3" fill="#C0392B"/>
        <rect x="20" y="13" width="24" height="3.5" rx="1.5" fill="#2B4544"/>
        <path d="M23 31q9 4 18 0v4q-9 4-18 0z" fill="#C0392B"/>
        <path d="M35 34l3 9h-5l-1-8z" fill="#C0392B"/>
        <path d="M32 24l9 2-9 2z" fill="#E07B2A"/>
      </g>
      <circle cx="28.5" cy="21" r="1.6" fill="#2B4544"/>
      <circle cx="35.5" cy="21" r="1.6" fill="#2B4544"/>
      <circle cx="32" cy="44" r="1.8" fill="#2B4544"/>
      <circle cx="32" cy="51" r="1.8" fill="#2B4544"/>
    </symbol>

    <symbol id="snowdog" viewBox="0 0 64 64">
      <use href="#snowdog-shape" xlink:href="#snowdog-shape" fill="#2B4544" stroke="#2B4544" stroke-width="5"/>
      <use href="#snowdog-shape" xlink:href="#snowdog-shape" fill="#fff"/>
      <g stroke="#2B4544" stroke-width="1.5" stroke-linejoin="round">
        <path d="M25 13Q30 1 43 4L39 13Z" fill="#C0392B"/>
        <rect x="23" y="11" width="18" height="5" rx="2.5" fill="#fff"/>
        <circle cx="44" cy="5" r="3" fill="#fff"/>
        <path d="M23 34q9 4 18 0" fill="none" stroke="#C0392B" stroke-width="3"/>
        <circle cx="32" cy="39.5" r="2.6" fill="#E2A93B"/>
        <path d="M30 29q2 4 4 0" fill="#E58C8A" stroke-width="1.2"/>
      </g>
      <ellipse cx="32" cy="27" rx="3" ry="2.2" fill="#2B4544"/>
      <circle cx="28" cy="22" r="1.6" fill="#2B4544"/>
      <circle cx="36" cy="22" r="1.6" fill="#2B4544"/>
      <circle cx="26" cy="54" r="2.5" fill="none" stroke="#2B4544" stroke-width="1.2"/>
      <circle cx="38" cy="54" r="2.5" fill="none" stroke="#2B4544" stroke-width="1.2"/>
    </symbol>

    <symbol id="reindeer" viewBox="0 0 64 64">
      <use href="#antlers" xlink:href="#antlers" fill="none" stroke="#2B4544" stroke-width="6" stroke-linecap="round"/>
      <use href="#antlers" xlink:href="#antlers" fill="none" stroke="#9C6B3F" stroke-width="3" stroke-linecap="round"/>
      <use href="#deer-shape" xlink:href="#deer-shape" fill="#2B4544" stroke="#2B4544" stroke-width="5"/>
      <use href="#deer-shape" xlink:href="#deer-shape" fill="#A0663A"/>
      <ellipse cx="32" cy="45" rx="8" ry="6" fill="#D9A066" stroke="#2B4544" stroke-width="2"/>
      <circle cx="32" cy="41" r="4.5" fill="#E53935" stroke="#2B4544" stroke-width="2"/>
      <circle cx="30.5" cy="39.5" r="1.2" fill="#fff"/>
      <circle cx="27" cy="31" r="1.8" fill="#2B4544"/>
      <circle cx="37" cy="31" r="1.8" fill="#2B4544"/>
    </symbol>

    <symbol id="antler-dog" viewBox="0 0 64 64">
      <use href="#antlers" xlink:href="#antlers" fill="none" stroke="#2B4544" stroke-width="6" stroke-linecap="round" transform="translate(0 2)"/>
      <use href="#antlers" xlink:href="#antlers" fill="none" stroke="#9C6B3F" stroke-width="3" stroke-linecap="round" transform="translate(0 2)"/>
      <circle cx="32" cy="36" r="14" fill="#E2A13F" stroke="#2B4544" stroke-width="2.5"/>
      <ellipse cx="15.5" cy="37" rx="5" ry="11" transform="rotate(18 15.5 37)" fill="#B87A3A" stroke="#2B4544" stroke-width="2.5"/>
      <ellipse cx="48.5" cy="37" rx="5" ry="11" transform="rotate(-18 48.5 37)" fill="#B87A3A" stroke="#2B4544" stroke-width="2.5"/>
      <ellipse cx="32" cy="43" rx="8" ry="6" fill="#F3D19B" stroke="#2B4544" stroke-width="2"/>
      <path d="M30 47q2 5 4 0" fill="#E58C8A" stroke="#2B4544" stroke-width="1.2"/>
      <ellipse cx="32" cy="39.5" rx="3.5" ry="2.6" fill="#2B4544"/>
      <circle cx="26" cy="32" r="1.8" fill="#2B4544"/>
      <circle cx="38" cy="32" r="1.8" fill="#2B4544"/>
    </symbol>

    <symbol id="flake" viewBox="0 0 64 64">
      <g fill="none" stroke="#7FA6A6" stroke-width="3" stroke-linecap="round">
        <use href="#flake-arm" xlink:href="#flake-arm"/>
        <use href="#flake-arm" xlink:href="#flake-arm" transform="rotate(60 32 32)"/>
        <use href="#flake-arm" xlink:href="#flake-arm" transform="rotate(120 32 32)"/>
        <use href="#flake-arm" xlink:href="#flake-arm" transform="rotate(180 32 32)"/>
        <use href="#flake-arm" xlink:href="#flake-arm" transform="rotate(240 32 32)"/>
        <use href="#flake-arm" xlink:href="#flake-arm" transform="rotate(300 32 32)"/>
      </g>
    </symbol>

    <symbol id="holly" viewBox="0 0 64 64">
      <g fill="#3E7B4F" stroke="#2B4544" stroke-width="2" stroke-linejoin="round">
        <use href="#leaf" xlink:href="#leaf"/>
        <use href="#leaf" xlink:href="#leaf" transform="matrix(-1 0 0 1 64 0)"/>
        <use href="#leaf" xlink:href="#leaf" transform="rotate(180 32 34) translate(0 -2)"/>
      </g>
      <g fill="#C0392B" stroke="#2B4544" stroke-width="1.5">
        <circle cx="28" cy="34" r="4"/>
        <circle cx="36" cy="34" r="4"/>
        <circle cx="32" cy="28" r="4"/>
      </g>
    </symbol>

    <symbol id="present" viewBox="0 0 64 64">
      <g stroke="#2B4544" stroke-width="2.5" stroke-linejoin="round">
        <ellipse cx="25" cy="15" rx="8" ry="5" transform="rotate(25 25 15)" fill="#E2A93B"/>
        <ellipse cx="39" cy="15" rx="8" ry="5" transform="rotate(-25 39 15)" fill="#E2A93B"/>
        <rect x="12" y="28" width="40" height="32" fill="#C0392B"/>
        <rect x="9" y="20" width="46" height="10" rx="1.5" fill="#C0392B"/>
        <rect x="29" y="20" width="6" height="40" fill="#E2A93B"/>
      </g>
    </symbol>

    <symbol id="paw" viewBox="0 0 64 64">
      <g fill="#C0392B">
        <ellipse cx="32" cy="42" rx="13" ry="11"/>
        <ellipse cx="14" cy="27" rx="5.5" ry="7" transform="rotate(-20 14 27)"/>
        <ellipse cx="25" cy="17" rx="5.5" ry="7.5"/>
        <ellipse cx="39" cy="17" rx="5.5" ry="7.5"/>
        <ellipse cx="50" cy="27" rx="5.5" ry="7" transform="rotate(20 50 27)"/>
      </g>
    </symbol>

    <symbol id="bauble" viewBox="0 0 64 64">
      <path d="M32 2v8" stroke="#2B4544" stroke-width="2" fill="none"/>
      <g stroke="#2B4544" stroke-width="2.5">
        <circle cx="32" cy="38" r="20" fill="#C0392B"/>
        <rect x="26" y="10" width="12" height="9" rx="1.5" fill="#E2A93B"/>
      </g>
      <path d="M13 36l6 5 6-5 7 5 7-5 6 5 6-5" fill="none" stroke="#E2A93B" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M22 29q3-6 9-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Layout: spread evenly so the repeat seams don't show; nothing crosses the tile edge. -->
  <g opacity="0.15">
    <use href="#cane"        xlink:href="#cane"        x="20"  y="30"  width="60" height="60" transform="rotate(-15 50 60)"/>
    <use href="#flake"       xlink:href="#flake"       x="170" y="24"  width="40" height="40"/>
    <use href="#tree"        xlink:href="#tree"        x="290" y="40"  width="72" height="72"/>
    <use href="#ginger-dog"  xlink:href="#ginger-dog"  x="440" y="30"  width="76" height="72" transform="rotate(-6 478 66)"/>
    <use href="#antler-dog"  xlink:href="#antler-dog"  x="70"  y="165" width="72" height="72" transform="rotate(6 106 201)"/>
    <use href="#holly"       xlink:href="#holly"       x="225" y="180" width="52" height="52" transform="rotate(20 251 206)"/>
    <use href="#snowman"     xlink:href="#snowman"     x="355" y="160" width="72" height="72" transform="rotate(4 391 196)"/>
    <use href="#flake"       xlink:href="#flake"       x="520" y="160" width="36" height="36"/>
    <use href="#gingerbread" xlink:href="#gingerbread" x="20"  y="320" width="64" height="64" transform="rotate(-10 52 352)"/>
    <use href="#present"     xlink:href="#present"     x="165" y="320" width="56" height="56" transform="rotate(8 193 348)"/>
    <use href="#reindeer"    xlink:href="#reindeer"    x="285" y="300" width="72" height="72" transform="rotate(-5 321 336)"/>
    <use href="#paw"         xlink:href="#paw"         x="435" y="305" width="40" height="40" transform="rotate(-20 455 325)"/>
    <use href="#cane"        xlink:href="#cane"        x="520" y="280" width="56" height="56" transform="rotate(20 548 308)"/>
    <use href="#snowdog"     xlink:href="#snowdog"     x="80"  y="460" width="76" height="76" transform="rotate(-4 118 498)"/>
    <use href="#flake"       xlink:href="#flake"       x="235" y="470" width="48" height="48" transform="rotate(15 259 494)"/>
    <use href="#bauble"      xlink:href="#bauble"      x="345" y="450" width="54" height="54" transform="rotate(10 372 477)"/>
    <use href="#tree"        xlink:href="#tree"        x="470" y="440" width="64" height="64" transform="rotate(6 502 472)"/>
    <use href="#paw"         xlink:href="#paw"         x="10"  y="540" width="34" height="34" transform="rotate(25 27 557)"/>
    <use href="#gingerbread" xlink:href="#gingerbread" x="545" y="540" width="46" height="46" transform="rotate(12 568 563)"/>
  </g>
</svg>
